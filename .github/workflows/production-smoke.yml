name: Production API smoke

on:
  pull_request:
    paths:
      - ".github/workflows/production-smoke.yml"
      - "scripts/validate-health-response.mjs"
      - "tests/validate-health-response.test.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-smoke.yml"
      - "scripts/validate-health-response.mjs"
      - "tests/validate-health-response.test.mjs"
  workflow_run:
    workflows:
      - Deploy Backend to EC2
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate health response contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Run health contract tests
        run: node --test tests/validate-health-response.test.mjs

  production:
    name: Check public production health
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: https://lunchsync-api.duckdns.org/api/health

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Request and validate public health endpoint
        shell: bash
        run: |
          set -u -o pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          health_host="$(node -e 'console.log(new URL(process.env.HEALTH_URL).hostname)')"

          echo "Resolving $health_host before the HTTP request:"
          if ! getent ahosts "$health_host" | awk '{ print $1 }' | sort -u; then
            echo "DNS lookup failed for $health_host."
          fi

          set +e
          http_code="$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-all-errors \
            --output "$response_file" --write-out "%{http_code}" \
            "$HEALTH_URL")"
          curl_status=$?
          set -e

          if [[ "$curl_status" -ne 0 ]]; then
            echo "curl failed with exit status $curl_status before a valid HTTP response."
            if timeout 10 bash -c 'exec 3<>"/dev/tcp/$1/443"' _ "$health_host"; then
              echo "TCP connection to $health_host:443 succeeded."
              echo "Inspecting the TLS handshake:"
              timeout 10 openssl s_client \
                -connect "${health_host}:443" -servername "$health_host" \
                -brief </dev/null || true
            else
              echo "TCP connection to $health_host:443 failed or timed out."
            fi
            exit "$curl_status"
          fi

          if [[ "$http_code" != "200" ]]; then
            echo "Expected HTTP 200 from the public health endpoint, received $http_code."
            exit 1
          fi

          node scripts/validate-health-response.mjs < "$response_file"
