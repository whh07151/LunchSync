name: Deploy LunchSync backend (manual approval required)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Immutable commit SHA or protected branch to deploy
        required: true
        default: agent/reliability-observability
      confirm_production_deployment:
        description: Type DEPLOY to acknowledge that this changes the configured EC2 runtime
        required: true
        default: DO_NOT_DEPLOY

permissions:
  contents: read

concurrency:
  group: lunchsync-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify selected revision
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build

  deploy:
    name: Deploy verified revision
    needs: verify
    if: inputs.confirm_production_deployment == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy the verified immutable revision over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DEPLOY_SHA
          script_stop: true
          script: |
            set -eu
            cd /home/ubuntu/LunchSync
            git fetch --depth=1 origin "$DEPLOY_SHA"
            git checkout --detach "$DEPLOY_SHA"
            cd backend
            npm ci
            npm run build
            pm2 reload lunchsync-backend --update-env || pm2 start dist/main.js --name lunchsync-backend --update-env
            sleep 4
            curl --fail --show-error --max-time 5 http://127.0.0.1:3000/api/ready
        env:
          DEPLOY_SHA: ${{ needs.verify.outputs.revision }}
